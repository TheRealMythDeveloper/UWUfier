
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWUfier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="terminal">
        <div id="typing-area">
            <span id="face"></span><span id="cursor"></span>
        </div>

        <div id="floating-face">
            <span id="float-character">>:3</span>
        </div>

        <div id="message"></div>
    </main>

    <script>
        const typingArea = document.getElementById("typing-area");
        const face = document.getElementById("face");
        const cursor = document.getElementById("cursor");
        const floatingFace = document.getElementById("floating-face");
        const message = document.getElementById("message");

        const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

        async function typeText(element, text, speed = 250) {
            for (const char of text) {
                element.textContent += char;
                await sleep(speed);
            }
        }

        async function start() {
            await sleep(2500);

            await typeText(face, ":3", 650);
            await sleep(1800);

typingArea.classList.add("cursor-back");
            await sleep(450);

            face.textContent = ">:3";
            await sleep(350);

            cursor.style.display = "none";

            typingArea.classList.add("vanish");

            await sleep(700);

            floatingFace.classList.add("appear");

            await sleep(1800);

            message.classList.add("visible");
            await typeText(message, "Why awe you twying to uninstaww me?", 120);

            await sleep(2500);

            message.classList.remove("visible");
            floatingFace.classList.add("fly");
        }

        start();
    </script>
</body>
</html>
