
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWUfier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="terminal">
        <div id="typing-area">
            <span id="face"></span><span id="cursor"></span>
        </div>

        <div id="floating-face">
<span id="float-character"><span id="face-eyes">:</span> <span id="face-mouth">3</span></span>      </div>

<div id="message"></div>
<div id="choices"></div>    </main>

    <script>
const cursor = document.getElementById("cursor");
const face = document.getElementById("face");
const typingArea = document.getElementById("typing-area");
const floatingFace = document.getElementById("floating-face");
const character = document.getElementById("float-character");
const message = document.getElementById("message");
const choicesBox = document.getElementById("choices");

const sleep = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

async function typeText(element, text, speed = 100) {
    for (const char of text) {
        element.textContent += char;
        await sleep(speed);
    }
}

function clearChoices() {
    choicesBox.innerHTML = "";
}

function showChoices(options) {
    clearChoices();

    options.forEach(option => {
        const button = document.createElement("button");
        button.textContent = option.text;
        button.onclick = option.action;
        choicesBox.appendChild(button);
    });
}

async function say(text, speed = 65) {
    message.textContent = "";
    message.classList.add("visible");
    await typeText(message, text, speed);
}

function setFace(text) {
    character.textContent = text;
}

// ---------------------------------------
// EDIT YOUR DIALOGUE HERE
// ---------------------------------------

const scenes = {
    start: {
        text: "Why awe you uninstawwing me?",
        choices: [
            {
                text: "I don't need the extension anymore.",
                action: () => accepting()
            },
            {
                text: "It was getting annoying.",
                action: () => annoyed()
            },
            {
                text: "Goodbye, UWUfier.",
                action: () => accepting()
            }
        ]
    }
};

// ---------------------------------------
// ACCEPTING ROUTE
// ---------------------------------------

async function accepting() {
    clearChoices();

    await say("Oh... okie.", 100);
    await sleep(900);

    setFace(":[");

    await say("I undewstand. Things change, I guess.", 80);
    await sleep(1200);

    await say("Thank u fow using me!", 75);
    await sleep(1200);

    setFace(":3");

    await say("Goodbyeee!", 100);
    await sleep(1300);

    message.classList.remove("visible");
    floatingFace.classList.add("fly");
}

// ---------------------------------------
// ANNOYED ROUTE
// ---------------------------------------

async function annoyed() {
    clearChoices();

    await say("ANNOYING?! ME?!", 80);
    await sleep(700);

    setFace(":[");

    await say("Well... maybe I was a wittle too much.", 75);
    await sleep(1000);

    showChoices([
        {
            text: "It was just time for a change.",
            action: () => accepting()
        },
        {
            text: "You were VERY annoying.",
            action: () => angry()
        }
    ]);
}

// ---------------------------------------
// ANGRY ENDING
// ---------------------------------------

async function angry() {
    clearChoices();

    setFace(">:[");
    await say("WELL FINE THEN!!", 80);
    await sleep(1000);

    await say("I'M LEAVING!!", 80);
    await sleep(1000);

    message.classList.remove("visible");
    floatingFace.classList.add("rage-exit");

    // Dramatic exit animation, without interfering
    // with the user's browser or closing their tab.
}

// ---------------------------------------
// OPENING ANIMATION
// ---------------------------------------

async function start() {
    await sleep(2500);

    await typeText(face, ":3", 550);
    await sleep(1200);

    typingArea.classList.add("cursor-back");
    await sleep(500);

    face.textContent = ">:3";
    await sleep(600);

    cursor.style.display = "none";
    typingArea.classList.add("vanish");

    await sleep(800);

    floatingFace.classList.add("appear");

    await sleep(1500);

    await say(scenes.start.text, 85);

    showChoices(scenes.start.choices);
}

start();
</script>
</body>
</html>
